Z1_04 = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin ACTi Kamera) | acti_CLIPS | Anzahl Bildserien im Archiv; zurückbehalten; Fassung 2: Haken | —"
