[TOKEN]
K_NEU_WARNUNG = "<b>Achtung:</b> ein neues Token macht jede Adresse in Loxone und jede Auslöseadresse in der Kamera (<span class='sm-mono'>e.php?t=…</span>) sofort ungültig. Danach müssen beide Importdateien neu erzeugt und eingelesen und die Adressen in der Kamera neu eingetragen werden."
H = "Aktionstoken — Schritt 2a"
TEXT = "Jeder Aufruf, der etwas auslöst, verlangt dieses Token. Es steht in den Adressen unten und wird beim ersten Öffnen dieser Seite erzeugt. Ohne Token antwortet der Endpunkt mit HTTP 403, und ein virtueller Ausgang wertet die Antwort nicht aus — der Ausfall bliebe still."
OFFEN = "Ohne Token erreichbar bleiben nur Aufrufe, die nichts verändern: die Statuszeile und <span class='sm-mono'>?json=1</span>. <span class='sm-mono'>?letztes=1</span> gehört seit 1.9.19 hinter das Stromkennwort — wer eines gesetzt hat, hängt an diese Adresse <span class='sm-mono'>&amp;t=…</span> an; ohne Stromkennwort bleibt sie offen wie bisher."
PRUEFEN = "So prüfen Sie, ob eine in Loxone eingetragene Adresse noch stimmt — ohne dass etwas ausgelöst wird:"
PRUEFEN_ANTWORT = "Antwort bei richtigem Token: <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span>. Bei falschem Token HTTP 403 und <span class='sm-mono'>SELFTEST;OK=0;ERR=TOKEN</span>."
K_NEU = "Neues Token erzeugen"

[AUSL]
H = "Auslösung durch die Kamera oder ein anderes Gerät"
TEXT = "Manche Kameras können bei eigener Bewegungserkennung selbst eine Adresse aufrufen (beim ACTi-Web-Konfigurator unter <i>Ereignis → Ereignis-Server → HTTP-Server</i>). Diese Adresse gehört dort hinein — sie nimmt ein Bild auf, sonst nichts. Anhängen lässt sich <span class='sm-mono'>&amp;a=klingel</span> für einen anderen Anlass und <span class='sm-mono'>&amp;c=1</span> für eine Bildserie."
LAENGE = "%d Zeichen."
ANMELDUNG = "Verlangt die Kamera zusätzlich <i>Benutzername</i>, <i>Benutzerpasswort</i> und einen <i>Netzwerkport</i> — der ACTi-Konfigurator tut das —, dann trage als Port <span class='sm-mono'>80</span> ein und bei den Anmeldedaten etwas Bedeutungsloses, etwa <span class='sm-mono'>kamera</span> und <span class='sm-mono'>x</span>. Das Plugin wertet sie nicht aus. Ein echtes Kennwort gehört dort nicht hinein: die Kamera schickt es bei jedem Auslösen als HTTP-Basic über das Netz, und das ist nur Base64."
ZU_LANG = "Das Adressfeld der ACTi-Kamera fasst nur 64 Zeichen — diese Adresse wird abgeschnitten und die Kamera erreicht den LoxBerry nicht. Ein kürzerer Rechnername hilft."
HINWEIS = "Dieses Token darf ausschließlich aufnehmen — es kann das Archiv nicht aufräumen und keine Diagnose lesen. Jede Kamera hat ihr eigenes; das Token sagt dem Plugin, welche gemeint ist. Der Knopf Neues Token erzeugen würfelt auch diese neu."

[BAUSTEIN]
TEXT = "Zwei Seiten aus dem LoxBerry-Plugins Musterprojekt, dort in Loxone Config gebaut und verbunden: <b>„ACTi-Kamera“</b> zeigt, ob Plugin und Kamera laufen, und meldet eine Störung (für jeden); <b>„ACTi-Kamera Aufnahmen“</b> nimmt bei Klingel, Taster und Bewegung ein Bild auf und meldet Aufnahmen bei Abwesenheit. Seit 1.9.32 kommen die Werte über das MQTT-Gateway (Virtuelle Eingänge mit den Namen aus Schritt 1) und die Befehle über die Befehlsbrücke (Schritt 2) – ohne Token in der Projektdatei. Je Seite: Anleitung, Tabelle (von oben nach unten abarbeiten), Hinweise und Bild; die Namen gelten für Kamera 1. Die Bausteine finden sich in Loxone Config über die Baustein-Suche (<b>F5</b>)."
T_TYP = "Baustein (Typ)"
T_NAME = "Name"
T_PARAM = "Parameter"
T_VERB = "Eingänge verbinden mit"
SCHRITTE_TITEL = "So übernehmen Sie diese Seite"
HINWEISE_TITEL = "Hinweise"
S1_SCHRITT1 = "Im Plugin Reiter „%s“ Adresse, Benutzer und Kennwort der Kamera eintragen, „%s“ auf 5 lassen, speichern. Reiter „%s“ → „%s“ und „%s“: ein Bild muss erscheinen."
S1_SCHRITT2 = "Reiter „%s“: „%s“ eingeschaltet lassen (ab 1.9.32 ab Werk an). Im MQTT-Gateway von LoxBerry unter Fassung 1 nichts eintragen (die Abo-Datei des Plugins trägt acti/#), unter Fassung 2 die Datenpunkte aus Schritt 1 anhaken, acti_OK und acti_ERREICHBAR mit „Noncached“. In Loxone Config im Baum „Virtuelle Eingänge“ je Wert einen Virtuellen Eingang mit genau dem Namen aus Schritt 1 anlegen (Kopierknopf), „Als Digitaleingang verwenden“ nicht anhaken; der LoxBerry-Benutzer braucht in Loxone Rechte auf diese Eingänge."
S1_SCHRITT3 = "Seite „ACTi-Kamera“ anlegen, die Virtuellen Eingänge Nr. 1–9 daraufziehen, dazu die Konstante 1 (Nr. 10, Baustein-Suche F5, Wert 1). Die Benachrichtigung „Meldung Plugin gestört (ACTi)“ anlegen (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Tabelle; sie bekommt genau eine Leitung."
S1_SCHRITT4 = "Übrige Bausteine über die Baustein-Suche (Taste F5) setzen, Parameter wie in der Tabelle, von oben nach unten verbinden. An der Analogwertvalidierung Nr. 11 den Haken bei ‚En‘ im Eigenschaftsfenster entfernen (Config legt En negiert an; sonst kommt die Konstante 1 als 0 an). Status „Zustand (ACTi)“: vorher zweimal „+“ klicken (V5, V6); die Zeilen in der angegebenen Reihenfolge eintragen, die ohne Bedingung zuletzt."
S1_SCHRITT5 = "Speichern und in den Miniserver übertragen. Probe: „Zustand (ACTi)“ zeigt „läuft – Kamera antwortet …“, und acti_zaehler zählt jede Minute eins weiter. Beim Systemstart des Miniservers „reconnect“ an das Gateway senden (Seite „LoxBerry MQTT-Gateway“ im Musterprojekt), dann stehen die zurückbehaltenen Werte sofort an."
S1_H1 = "Die Meldung kommt erst nach 10 Minuten Störung; ein Neustart von LoxBerry, Miniserver oder Kamera meldet nichts – Erreichbarkeit und Lebenszeichen kommen jede Minute. Auch eine bewusst stromlos geschaltete Kamera meldet nach 10 Minuten."
S1_H2 = "Zu Nr. 9 und 11: acti_zaehler ist das Lebenszeichen des Minutentakts über MQTT. Steht der LoxBerry, das Gateway oder der Takt, behalten alle Eingänge ihren letzten Wert – nur das stehende Lebenszeichen verrät es. Die Themen online und ts gibt es seit 1.9.32 nicht mehr; wer sie in einer eigenen Logik nutzt, nimmt acti_zaehler."
S1_H3 = "Zu Nr. 12: Die Erkennung „Kamera antwortet nicht“ braucht die Prüfung im Plugin (acti_ERREICHBAR); acti_OK heißt nur „Adresse eingetragen“. Wer „%s“ auf 0 stellt, sieht nur noch das Lebenszeichen des LoxBerry."
S1_H4 = "Mehrere Kameras: je Kamera kommen acti_OK2, acti_ERREICHBAR2 … dazu (Kamera 1 bleibt, wie sie ist; Namen siehe Schritt 1). Je Kamera ein eigenes NICHT an ihrem ERREICHBAR, die Störungen über weitere ODER (je zwei Eingänge) vor Nr. 14 – nie mehrere Quellen direkt an die Benachrichtigung. Lebenszeichen und Minutentakt gibt es nur einmal."
S1_H5 = "Wer bis 1.9.31 nach dem virtuellen HTTP-Eingang „ACTi Kamera“ gebaut hat: der Weg bleibt (Reiter Einbindung, „Bestehende Anlagen“; bei einem Update bleibt der Lesezweig an). Für neue Anlagen die Virtuellen Eingänge nehmen – nicht beide Wege zugleich."
S2_SCHRITT1 = "Im Plugin Reiter „%s“ den Haken „%s“ setzen und speichern (ab Werk aus; wirkt nur zusammen mit „Werte über MQTT veröffentlichen“). Im Plugin Reiter „%s“ „%s“ eingeschaltet lassen, „%s“ auf 2."
S2_SCHRITT2 = "Seite „ACTi-Kamera Aufnahmen“ anlegen. Die vier Befehle Nr. 5, 7, 9, 11 als Virtuelle Ausgang-Befehle am vorhandenen Ausgang „LoxBerry MQTT-Gateway“ (/dev/udp/<LoxBerry>/11884) anlegen, Befehl bei Ein wie in der Tabelle, nie „retain“; die Virtuellen Eingänge Nr. 12–17 und 23–24 (Namen aus Schritt 1) daraufziehen, „Türklingel (eigene Quelle)“ aus dem Baum dazu (im eigenen Projekt die eigene Klingel)."
S2_SCHRITT3 = "Die Tasten „Türtaster (eigene Quelle)“ und „Bewegungsmelder (eigene Quelle)“ als Virtuelle Eingänge anlegen (oder gleich die eigenen Eingänge nehmen), dazu die Benachrichtigungen „Meldung Aufnahme bei Abwesenheit (ACTi)“ und „Meldung Test-Push (ACTi)“ (Peripherie → Mitteilungen → Benachrichtigung), Text wie in der Tabelle. Die Anwesenheit kommt vom BLE-Scanner NG (dort den Haus-Wert haus/anwesenheit einschalten)."
S2_SCHRITT4 = "Übrige Bausteine über die Baustein-Suche (F5) setzen und von oben nach unten verbinden. Am UND Nr. 3 beide Eingänge negieren, am UND Nr. 4 den Eingang I2: auf den Eingangspunkt klicken, danach zeigt der Eingang einen kleinen Kreis. An der Analogwertvalidierung Nr. 26 den Haken bei ‚En‘ entfernen. Status „Aufnahmen (ACTi)“: vorher zweimal „+“ klicken (V5, V6)."
S2_SCHRITT5 = "Speichern und übertragen. Probe: „Türklingel (eigene Quelle)“ in der App drücken – nach 3 s entsteht ein Bild (Plugin Reiter „%s“), „Aufnahmen (ACTi)“ zeigt „gerade aufgenommen“. Im Plugin Reiter „%s“ → „%s“: die Meldung „Meldung Test-Push (ACTi)“ kommt binnen weniger Sekunden."
S2_H1 = "Wer bis 1.9.31 gebaut hat: die vier Befehle am Ausgang „ACTi Kamera senden“ (HTTP mit Aktionstoken) durch die Befehle am Ausgang „LoxBerry MQTT-Gateway“ ersetzen und im Plugin den Haken „Befehle über MQTT annehmen“ setzen; die HTTP-Befehle wirken weiter, solange sie im Projekt stehen – nicht beide zugleich, sonst entstehen zwei Bilder."
S2_H2 = "Bild bei Klingeln: ist jemand zu Hause, ein Einzelbild; ist niemand da, eine Bildserie und die Meldung „Aufnahme bei Abwesenheit“ – nie Bild und Bildserie zugleich. Der Wert hinter dem Befehl (klingel, tuer, bewegung) kommt als Anlass in den Dateinamen, ins Protokoll und ins MQTT-Thema anlass. Schweigt die Anwesenheitsquelle länger als 120 s, gilt „jemand zu Hause“."
S2_H3 = "Wer die Kamera selbst auslösen lässt, stellt im Plugin „%s“ auf 20–30 – sie gilt für alle Wege (HTTP, Kamera, MQTT); eine Klingel kurz nach einer Bewegung wird dann abgewiesen (das Plugin meldet es im Protokoll und in der Quittung). Löst die Kamera dauernd selbst aus, steht acti_PUSHAKTIV dauerhaft auf 1, und „Aufnahme bei Abwesenheit“ meldet nur einmal."
S2_H4 = "Zusammen mit der Seite „Intercom“: dieselbe Klingel verzögert dort das Foto der Türstation. Im eigenen Projekt beide Fotobefehle hinter EINE Verzögerung legen; Signal-Nachricht und Ansage beim Klingeln kommen von den Seiten „Intercom“, „SignalBot Befehle und Meldungen“ und „Sprachsteuerung“ – hier nicht noch einmal."
S2_H5 = "Das letzte Bild in der App: die Adresse aus „Bild in der App anzeigen“ (…/plugins/actikamera/letztesbild.jpg) in den Baustein Türsteuerung bzw. Intercom oder in eine Webseite eintragen; den Livestrom liefert …/cam_stream.php. Beide hängen nicht am HTTP-Lesezweig. Eine Loxone-Benachrichtigung trägt kein Bild."
S2_H6 = "„Person vor der Kamera“ (Nr. 21) ist der Schaltausgang für ein Außenlicht; er arbeitet nur mit eingeschalteter „%s“. Ein weiterer Auslöser einer Meldung kommt über ein ODER vor Nr. 18 bzw. 19 – nie mehrere Quellen direkt an eine Benachrichtigung. Mehrere Kameras: je Kamera eine eigene UND-Kette an ihrem PUSHAKTIV, zusammengefasst über ein ODER vor Nr. 19."
