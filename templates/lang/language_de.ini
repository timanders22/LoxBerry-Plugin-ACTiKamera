[AUSL]
H = "Auslösung durch die Kamera oder ein anderes Gerät"
TEXT = "Manche Kameras können bei eigener Bewegungserkennung selbst eine Adresse aufrufen (beim ACTi-Web-Konfigurator unter <i>Ereignis → Ereignis-Server → HTTP-Server</i>). Diese Adresse gehört dort hinein — sie nimmt ein Bild auf, sonst nichts. Anhängen lässt sich <span class='sm-mono'>&amp;a=klingel</span> für einen anderen Anlass und <span class='sm-mono'>&amp;c=1</span> für eine Bildserie."
LAENGE = "%d Zeichen."
ANMELDUNG = "Verlangt die Kamera zusätzlich <i>Benutzername</i>, <i>Benutzerpasswort</i> und einen <i>Netzwerkport</i> — der ACTi-Konfigurator tut das —, dann trage als Port <span class='sm-mono'>80</span> ein und bei den Anmeldedaten etwas Bedeutungsloses, etwa <span class='sm-mono'>kamera</span> und <span class='sm-mono'>x</span>. Das Plugin wertet sie nicht aus. Ein echtes Kennwort gehört dort nicht hinein: die Kamera schickt es bei jedem Auslösen als HTTP-Basic über das Netz, und das ist nur Base64."
ZU_LANG = "Das Adressfeld der ACTi-Kamera fasst nur 64 Zeichen — diese Adresse wird abgeschnitten und die Kamera erreicht den LoxBerry nicht. Ein kürzerer Rechnername hilft."
HINWEIS = "Dieses Token darf ausschließlich aufnehmen — es kann das Archiv nicht aufräumen und keine Diagnose lesen. Jede Kamera hat ihr eigenes; das Token sagt dem Plugin, welche gemeint ist. Der Knopf Neues Token erzeugen würfelt auch diese neu."
