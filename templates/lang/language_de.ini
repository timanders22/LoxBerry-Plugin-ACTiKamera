WARUM = "<b>MQTT ist der bevorzugte Weg</b> – seit 1.9.32 für neue Anlagen ab Werk an, und das Musterprojekt nimmt ihn (Virtuelle Eingänge mit den Namen aus dem Reiter Einbindung). Das Plugin schiebt jede Änderung von sich aus zum Miniserver: eine Aufnahme, eine Personenerkennung und ein Test-Push liegen sofort nach der Aufnahme an; <span class='sm-mono'>PUSHAKTIV</span> fällt nach dem Meldefenster mit dem nächsten Minutentakt. Gesendet wird nur, was sich geändert hat, und alle 30 Minuten der volle Satz; die Zustände gehen zurückbehalten (retained) hinaus. Jede Minute kommen das Lebenszeichen <span class='sm-mono'>zaehler</span> sowie <span class='sm-mono'>OK</span> und <span class='sm-mono'>ERREICHBAR</span>. <span class='sm-mono'>ALTER</span> geht seit 1.9.32 wieder über MQTT (flüchtig), dazu <span class='sm-mono'>zeit_unix</span> (zurückbehalten) für eigene Logik."
