Z1_15 = "Benachrichtigung | Meldung Plugin gestört (ACTi) | Text: ACTi Kamera – seit 10 Minuten gestört: die Kamera antwortet nicht (Strom, Netz) oder der LoxBerry, das MQTT-Gateway bzw. der Minutentakt des Plugins steht. Klingel-Bilder fehlen dann. In der App den Status „Zustand (ACTi)“ lesen | Eingang = #14"
Z1_16 = "Status | Zustand (ACTi) | Zeilen: V5 = 0 „keine Kamera eingetragen – im Plugin Reiter Einstellungen Adresse, Benutzer und Kennwort der Kamera eintragen, speichern, dann Reiter Test ‚Verbindung prüfen‘“; V1 = 1 „kein Lebenszeichen seit 5 Minuten – LoxBerry, MQTT-Gateway (Fassung 1: Abo acti/#, Fassung 2: Haken an acti/zaehler) oder der Minutentakt des Plugins steht; im Plugin Reiter MQTT ‚Werte über MQTT veröffentlichen‘ prüfen“; V2 < 0 „Kamera noch nie geprüft – im Plugin Reiter Einstellungen ‚Erreichbarkeit prüfen alle … Minuten‘ über 0 stellen (ab Werk 5)“; V2 = 0 „Kamera antwortet nicht – <v3> Prüfungen in Folge ohne Antwort; Strom und Netz der Kamera prüfen, im Plugin Reiter Test ‚Verbindung prüfen‘“; V6 < 0 „läuft – Kamera antwortet, noch kein Bild aufgenommen“; ohne Bedingung „läuft – Kamera antwortet, letztes Bild vor <v6> min“; Visualisierung EIN | V1 = Ausgang E von #11, V2 = #6, V3 = #7, V5 = #1, V6 = #2"
Z1_17 = "Status | Archiv (ACTi) | Zeilen: V4 < 0 „noch kein Bild – im Plugin Reiter Test ‚Jetzt ein Bild aufnehmen‘ drücken“; ohne Bedingung „<v1> Bilder, <v2> Bildserien, <v3> Zeitrafferbilder im Archiv; letztes Bild vor <v4> min“; Visualisierung EIN | V1 = #3, V2 = #4, V3 = #5, V4 = #2"
