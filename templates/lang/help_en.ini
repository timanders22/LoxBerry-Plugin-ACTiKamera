; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "ACTi camera"
K02 = "Fetches images from an <b>ACTi network camera</b> (the E series and every model with the classic CGI interface) and makes them available to Loxone — <b>without the user name and password having to appear in the Loxone project file</b>."
K03 = "That is the actual purpose: if you connect a camera to Loxone directly, the address including <code>USER=…&amp;PWD=…</code> ends up in plain text in the project file — and therefore in every backup and every copy you pass on. With this plugin Loxone only calls <code>cam.php?foto=1</code>; the credentials stay on the LoxBerry."
K04 = "Compatible with LoxBerry 3.x and <b>LoxBerry 4</b> (pure PHP, PHP 7.4 and 8.x)."
K05 = "Features"
K06 = "<b>Snapshot on demand</b> — triggered by Loxone: doorbell, door button, motion detector; the trigger is stored with the image"
K07 = "<b>Image series</b> („clip“) over several seconds, without ffmpeg or extra packages"
K08 = "<b>The latest image at a fixed address</b> (<code>letztesbild.jpg</code>) for a camera tile, a web page block or a push attachment — without credentials in the URL"
K09 = "<b>Push trigger for Loxone</b>: <code>PUSHAKTIV=1</code> for an adjustable window after every capture"
K10 = "<b>Time lapse</b>: one image a day at the configured time into the subfolder <code>timelapse</code> (the file name is the date); if <code>ffmpeg</code> is present, <code>zeitraffer.mp4</code> is regenerated from it"
K11 = "<b>Archive clean-up</b> daily at 03:35, by <b>age and count</b> (0 means unlimited for each) across images, image series and time lapse — the newest files are kept"
K12 = "<b>AI object detection</b> (optional) through CodeProject.AI or DeepStack: detected objects appear in the JSON, in the webhooks, through MQTT and as <code>ERKANNT=</code> in the Loxone output; <code>PERSON=1</code> is the ready-made switch"
K13 = "<b>Webhooks</b>: webhook 1 as a POST with JSON, webhook 2 as a GET with parameters"
K14 = "<b>MQTT</b> through the LoxBerry MQTT gateway, <b>JSON</b> for third-party software"
K15 = "Tabs: Settings, Loxone integration (step by step including a complete list of blocks), Captures, Test, Log"
K16 = "Endpoints"
K17 = "Security and privacy"
K18 = "Credentials are kept exclusively in <code>config/plugins/actikamera/cam.json</code>; the file is set to <code>chmod 600</code> (readable by the owner only)"
K19 = "The password is never displayed in the interface and is masked in the log"
K20 = "The plugin contains <b>no personal data</b>"
K21 = "Captures are kept locally on the LoxBerry and are deleted after the configured retention time"
K22 = "Troubleshooting: „ERROR: not authorized“"
K23 = "The ACTi CGI <b>does not percent-decode its parameters</b>. A full <code>rawurlencode()</code> of the password turns it into a different string and the camera refuses — even though the same credentials work in a browser. Since v1.1.0 only the characters that would break the query string are replaced (<code>% &amp; = # +</code> and the space)."
K24 = "The second common cause: some models require HTTP basic or digest authentication and refuse if <code>USER</code>/<code>PWD</code> additionally appear in the URL. That is why the settings offer the <b>authentication method</b>; on „automatic“ the plugin tries URL parameters, basic and digest in turn and remembers the one that worked."
K25 = "Call"
K26 = "Purpose"
K27 = "<code>/plugins/actikamera/cam.php</code>"
K28 = "Loxone line <code>ACTI;OK=..;ALTER=..;PUSHAKTIV=..;…</code>"
K29 = "<code>/plugins/actikamera/cam.php?foto=1&amp;anlass=klingel</code>"
K30 = "Take an image"
K31 = "<code>/plugins/actikamera/cam.php?clip=1&amp;anlass=klingel</code>"
K32 = "Take an image series"
K33 = "<code>/plugins/actikamera/cam.php?letztes=1</code>"
K34 = "the latest image as JPEG"
K35 = "<code>/plugins/actikamera/cam.php?json=1</code>"
K36 = "State as JSON"
K37 = "<code>/plugins/actikamera/cam.php?test=1</code>"
K38 = "Connection test in plain text"
K39 = "<code>/plugins/actikamera/cam.php?timelapse=1</code>"
K40 = "Take a time-lapse image now"
K41 = "<code>/plugins/actikamera/cam.php?cleanup=1</code>"
K42 = "Clean up the archive now"
K43 = "<code>/plugins/actikamera/cam.php?ptest=1</code>"
K44 = "Trigger a test push message"
