H = "Action token — step 2a"
TEXT = "Every call that triggers something requires this token. It is part of the addresses below and is created when this page is opened for the first time. Without a token the endpoint answers HTTP 403, and a virtual output does not evaluate the answer — the failure would stay silent."
OFFEN = "Without a token only calls that change nothing remain reachable: the status line and <span class='sm-mono'>?json=1</span>. <span class='sm-mono'>?letztes=1</span> sits behind the stream password since 1.9.19 — if you have set one, append <span class='sm-mono'>&amp;t=…</span> to that address; without a stream password it stays open as before."
PRUEFEN = "This is how to check whether an address entered in Loxone is still valid — without triggering anything:"
PRUEFEN_ANTWORT = "Answer with the correct token: <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span>. With a wrong token HTTP 403 and <span class='sm-mono'>SELFTEST;OK=0;ERR=TOKEN</span>."
K_NEU = "Create new token"

[AUSL]
H = "Triggering by the camera or another device"
TEXT = "Some cameras can call an address themselves on their own motion detection (in the ACTi web configurator under <i>Event → Event Server → HTTP Server</i>). This is the address to enter there — it takes an image, nothing else. You may append <span class='sm-mono'>&amp;a=klingel</span> for a different trigger and <span class='sm-mono'>&amp;c=1</span> for an image series."
LAENGE = "%d characters."
ANMELDUNG = "If the camera additionally demands <i>user name</i>, <i>password</i> and a <i>network port</i> — the ACTi configurator does — enter <span class='sm-mono'>80</span> as the port and something meaningless as the credentials, for example <span class='sm-mono'>kamera</span> and <span class='sm-mono'>x</span>. The plugin does not evaluate them. A real password does not belong there: the camera sends it on every trigger as HTTP Basic over the network, and that is only Base64."
ZU_LANG = "The address field of the ACTi camera only holds 64 characters — this address will be cut off and the camera will not reach the LoxBerry. A shorter host name helps."
HINWEIS = "This token may only record — it cannot clean the archive and cannot read the diagnosis. Every camera has its own; the token tells the plugin which one is meant. The button Create new token also rolls these again."

[BAUSTEIN]
TEXT = "Two pages from the LoxBerry plugins sample project, built and connected there in Loxone Config: <b>“ACTi-Kamera”</b> shows whether plugin and camera are running and reports a fault (for everybody); <b>“ACTi-Kamera Aufnahmen”</b> takes a picture on doorbell, button and motion and reports recordings while nobody is home. Per page: instructions, table (work through it from top to bottom), notes and picture. Titles and commands are the same as in the import files under <i>Create everything at once</i>; the names apply to camera 1. Loxone Config finds the blocks via the block search (<b>F5</b>)."
T_TYP = "Block (type)"
T_NAME = "Name"
T_PARAM = "Parameters"
T_VERB = "Connect inputs to"
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "In the plugin tab “%s” enter address, user and password of the camera, leave “%s” at 5, save. Tab “%s” → “%s” and “%s”: a picture must appear."
S1_SCHRITT2 = "Tab “%s” → “%s”. In Loxone Config select “Virtual Inputs” in the tree, ribbon “Predefined HTTP devices → Import template…”. Import only ONCE (twice gives duplicate inputs). The container is called “ACTi Kamera”. Check that the Miniserver reaches the LoxBerry under the name in the address (otherwise enter the IP of the LoxBerry)."
S1_SCHRITT3 = "Create the page “ACTi-Kamera”, drag the commands no. 1–9 from the container “ACTi Kamera”, plus the constant 1 (no. 10, block search F5, value 1). Create the notification “Meldung Plugin gestört (ACTi)” (Periphery → Messages → Notification), text as in the table; it gets exactly one connection."
S1_SCHRITT4 = "Place the remaining blocks via the block search (key F5), parameters as in the table, connect from top to bottom. On the Value Validator no. 11 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0). Status “Zustand (ACTi)”: click “+” twice first (V5, V6); enter the rows in the given order, the one without condition last."
S1_SCHRITT5 = "Save and transfer to the Miniserver. Check: “Zustand (ACTi)” shows “läuft – Kamera antwortet …”, and ACTI_ZAEHLER counts on by one every minute."
S1_H1 = "The message only comes after 10 minutes of fault; a restart of LoxBerry or camera reports nothing. A camera that is deliberately switched off also reports after 10 minutes."
S1_H2 = "On no. 9 and 11: ACTI_ZAEHLER is the sign of life of the minute cycle (since 1.9.30). If the LoxBerry stands still, all inputs keep their last value – only the stationary sign of life reveals it; ACTI_HERZ alone is not enough (permanently 0 or 1 while the cycle runs). If you imported the input template before 1.9.30, add a command ACTI_ZAEHLER by hand in the container “ACTi Kamera” (command recognition as for ACTI_HERZ, just ZAEHLER instead of HERZ; Min -1, Max 999); importing again gives duplicate inputs."
S1_H3 = "On no. 12: detecting “camera does not answer” needs the check in the plugin (ACTI_ERREICHBAR); ACTI_OK only means “address entered”. If you set “%s” to 0, you only see the sign of life of the LoxBerry."
S1_H4 = "Several cameras: the import file grows by ACTI_OK2, ACTI_ERREICHBAR2 … (camera 1 stays as it is; add only the new commands by hand or create the file with all cameras before the first import). Per camera its own NOT on its ERREICHBAR, the faults via further ORs (two inputs each) in front of no. 14 – never several sources directly on the notification. Sign of life and minute cycle exist only once."
S1_H5 = "MQTT brings the same states faster, but without ALTER, HERZ and ZAEHLER – the sample project uses the virtual HTTP input; not both ways at once."
S2_SCHRITT1 = "Tab “%s” → “%s” and in Loxone Config in the tree “Virtual Outputs” → “Predefined devices → Import template…”. The addresses carry the action token – after “%s” fetch the file again and import it again. In the plugin tab “%s” leave “%s” switched on, “%s” at 2."
S2_SCHRITT2 = "Create the page “ACTi-Kamera Aufnahmen”, drag the four send commands (no. 5, 7, 9, 11) from the container “ACTi Kamera senden” and the six input commands (no. 12–17) from the container “ACTi Kamera”; add “Türklingel (eigene Quelle)” and “Niemand zu Hause (eigene Quelle)” from the tree (in your own project your own doorbell and your own presence)."
S2_SCHRITT3 = "Create the push buttons “Türtaster (eigene Quelle)” and “Bewegungsmelder (eigene Quelle)” as virtual inputs (or take your own inputs right away), plus the notifications “Meldung Aufnahme bei Abwesenheit (ACTi)” and “Meldung Test-Push (ACTi)” (Periphery → Messages → Notification), text as in the table."
S2_SCHRITT4 = "Place the remaining blocks via the block search (F5) and connect from top to bottom. On the AND no. 4 negate input I2: click on the input point, then the input shows a small circle. Status “Aufnahmen (ACTi)”: click “+” twice first (V5, V6)."
S2_SCHRITT5 = "Save and transfer. Check: press “Türklingel (eigene Quelle)” in the app – after 3 s a picture is taken (plugin tab “%s”), “Aufnahmen (ACTi)” shows “gerade aufgenommen”. In the plugin tab “%s” → “%s”: the message “Meldung Test-Push (ACTi)” arrives within one minute."
S2_H1 = "If you built after the list up to 1.9.29: remove the three Threshold Switches (“Aufnahme erfolgt”, “Push freigegeben”, “Test-Push läuft”) and connect ACTI_PUSHAKTIV and ACTI_PTEST directly. Behind a polled input a Threshold Switch gives a short pulse at every poll, the message would come every minute. ACTI_PUSHAKTIV already contains the push release; both are on/off values and belong directly on AND or notification."
S2_H2 = "Picture on ringing: if somebody is home, a single picture; if nobody is there, a picture series and the message “Aufnahme bei Abwesenheit” – never picture and series at once. The part anlass=… of the address (klingel, tuer, bewegung) goes as occasion into the file name, the log and the MQTT topic anlass."
S2_H3 = "If the camera triggers itself, set “%s” in the plugin to 20–30 – a doorbell shortly after a motion is then rejected (the plugin logs it); the picture of the motion usually shows the visitor already. If the camera keeps triggering itself, ACTI_PUSHAKTIV stays at 1 and “Aufnahme bei Abwesenheit” reports only once."
S2_H4 = "Together with the page “Intercom”: the same doorbell delays the photo of the door station there. In your own project put both photo commands behind ONE delay; Signal message and announcement on ringing come from the pages “Intercom”, “SignalBot Befehle und Meldungen” and “Sprachsteuerung” – not again here."
S2_H5 = "The last picture in the app: enter the address from step 5 (…/plugins/actikamera/letztesbild.jpg) in the Door Controller or Intercom block or in a web page; the live stream comes from …/cam_stream.php. Neither block is part of the sample project. A Loxone notification carries no picture."
S2_H6 = "“Person vor der Kamera” (no. 21) is the switching output for an outdoor light; it only works with “%s” switched on. A further trigger of a message comes via an OR in front of no. 18 or 19 – never several sources directly on a notification. Several cameras: per camera its own AND chain on its PUSHAKTIV, combined via an OR in front of no. 19."
Z1_01 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_OK | 1 = an address is entered for the camera in the plugin; does not say whether it answers (ACTI_ERREICHBAR says that) | —"
Z1_02 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_ALTER | age of the last picture in minutes; -1 = none yet | —"
Z1_03 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_BILDER | number of pictures in the archive | —"
Z1_04 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_CLIPS | number of picture series in the archive | —"
Z1_05 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_ZEITRAFFER | number of time-lapse pictures (only with time-lapse switched on in the plugin) | —"
Z1_06 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_ERREICHBAR | 1 = the camera answered at the last check (by default the plugin asks it every 5 minutes, without fetching a picture); 0 = no answer, or the last check is older than 15 minutes; -1 = never checked | —"
Z1_07 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_FEHLER | checks in a row without an answer of the camera; 0 = the last one worked | —"
Z1_08 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_HERZ | minutes since the last minute cycle of the plugin; -1 = never ran | —"
Z1_09 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_ZAEHLER | sign of life of the minute cycle, 0 to 999 – counts on by one with every run and therefore changes with every poll as long as LoxBerry and minute cycle are running; -1 = the minute cycle has never run | —"
Z1_10 = "Constant | Konstante 1 | value 1 | —"
Z1_11 = "Value Validator | Lebenszeichen fehlt (ACTi) | Tmc 300 s (five polls at 60 s), Min 0, Max 999 – if the LoxBerry or the minute cycle stands still, the sign of life stays at its last value; -1 (the minute cycle has never run) is below Min and reports as well; remove the tick at ‘En’ in the properties window | V = #9, En = #10"
Z1_12 = "NOT | Keine frischen Daten (ACTi) | — (the camera does not answer) | I = #6"
Z1_13 = "OR | Störung (ACTi) | — (no fresh data or sign of life missing) | I1 = #12, I2 = output E of #11"
Z1_14 = "Switch-On Delay | Störung bestätigt (ACTi) | 600 s (ten polls at 60 s, containing at least two checks of the camera; a restart of LoxBerry or camera reports nothing) | Input = #13"
Z1_15 = "Notification | Meldung Plugin gestört (ACTi) | Text: ACTi Kamera – faulty for 10 minutes: the camera does not answer (power, network) or the LoxBerry or the minute cycle of the plugin stands still. Doorbell pictures are missing then. Read the status “Zustand (ACTi)” in the app | Input = #14"
Z1_16 = "Status | Zustand (ACTi) | rows: V5 = 0 “no camera entered – in the plugin tab Settings enter address, user and password of the camera, save, then tab Test ‘Check connection’”; V4 < 0 “the minute cycle of the plugin has never run – wait one minute after the installation, otherwise restart the LoxBerry”; V4 >= 3 “the minute cycle of the plugin has been standing still for <v4> min, but the LoxBerry answers – in the plugin tab Test read the row ‘Is the minute cycle running?’, restart the LoxBerry”; V1 = 1 “sign of life missing for at least 5 minutes – the LoxBerry does not answer; open the LoxBerry in the browser”; V2 < 0 “camera never checked – in the plugin tab Settings set ‘Check reachability every … minutes’ above 0 (5 by default)”; V2 = 0 “camera does not answer – <v3> checks in a row without answer; check power and network of the camera, in the plugin tab Test ‘Check connection’”; V6 < 0 “running – camera answers, no picture taken yet”; without condition “running – camera answers, last picture <v6> min ago”; visualisation ON | V1 = output E of #11, V2 = #6, V3 = #7, V4 = #8, V5 = #1, V6 = #2"
Z1_17 = "Status | Archiv (ACTi) | rows: V4 < 0 “no picture yet – in the plugin tab Test press ‘Take a picture now’”; without condition “<v1> pictures, <v2> picture series, <v3> time-lapse pictures in the archive; last picture <v4> min ago”; visualisation ON | V1 = #3, V2 = #4, V3 = #5, V4 = #2"
Z2_01 = "Virtual input (push button) | Türklingel (eigene Quelle) | 1 = the doorbell rings (further instance, the same placeholder as on “Intercom”, “SignalBot Befehle und Meldungen” and “Dashboard Steuerung”); in your own project connect your own doorbell button or the bell output of the Door Controller block to no. 2 instead of this button | —"
Z2_02 = "Switch-On Delay | Klingel-Foto verzögern (ACTi) | 3 s (before that the visitor is not in the picture yet) | Input = #1"
Z2_03 = "Virtual input (switch) | Niemand zu Hause (eigene Quelle) | 1 = everybody is away (further instance, the same placeholder as on “Intercom” and “SignalBot Befehle und Meldungen”); in your own project connect your own presence to no. 4, 6 and 18 instead of this switch | —"
Z2_04 = "AND | Klingeln, jemand zu Hause (ACTi) | — (I2 negated: in Config click on the input point, a small circle appears) | I1 = #2, I2 = #3 (negated)"
Z2_05 = "Virtual output command (template “ACTi Kamera senden”) | ACTI_Bild_Klingel | command on ON: take a picture, occasion doorbell | Input = #4"
Z2_06 = "AND | Geklingelt, niemand zu Hause (ACTi) | — (a picture series instead of the single picture – never both at once, otherwise a configured minimum pause swallows one of them) | I1 = #2, I2 = #3"
Z2_07 = "Virtual output command (template “ACTi Kamera senden”) | ACTI_Bildserie_Klingel | command on ON: take a picture series (10 seconds, 2 pictures per second by default), occasion doorbell – shows who stood at the door while nobody was home | Input = #6"
Z2_08 = "Virtual input (push button) | Türtaster (eigene Quelle) | 1 = the button at the front door was pressed; in the app for trying out; in your own project connect your own button to no. 9 instead of this button | —"
Z2_09 = "Virtual output command (template “ACTi Kamera senden”) | ACTI_Bild_Tuer | command on ON: take a picture, occasion door button | Input = #8"
Z2_10 = "Virtual input (push button) | Bewegungsmelder (eigene Quelle) | 1 = motion in front of the door; in the app for trying out; in your own project connect your own motion detector to no. 11 instead of this button; if the camera triggers itself (plugin tab Loxone integration, “Triggering by the camera”), leave out no. 10 and 11 | —"
Z2_11 = "Virtual output command (template “ACTi Kamera senden”) | ACTI_Bild_Bewegung | command on ON: take a picture, occasion motion detector | Input = #10"
Z2_12 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_PUSHAKTIV | 1 = a picture was just taken (doorbell, button, motion or the camera itself) – stays 1 as long as the notification window set in the plugin (2 minutes by default); always 0 if the push release is off in the plugin | —"
Z2_13 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_PUSH | 1 = “Report Push release to Loxone” is switched on in the plugin | —"
Z2_14 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_PERSON | 1 = a person was detected in the last picture (only with AI object detection in the plugin); stays until the next picture | —"
Z2_15 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_OBJEKTE | number of detected objects in the last picture (only with AI object detection in the plugin) | —"
Z2_16 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_PTEST | 1 = test push running (5 minutes after the button “Test push message” in the plugin tab Test) | —"
Z2_17 = "Virtual HTTP input command (template “ACTi Kamera”) | ACTI_ALTER | age of the last picture in minutes; -1 = none yet (further instance, also on page “ACTi-Kamera”) | —"
Z2_18 = "AND | Aufnahme bei Abwesenheit (ACTi) | — (the camera took a picture while nobody is home) | I1 = #12, I2 = #3"
Z2_19 = "Notification | Meldung Aufnahme bei Abwesenheit (ACTi) | Text: ACTi Kamera – a picture was taken at the front door (doorbell, motion or the camera itself) while nobody is home. Pictures in the plugin tab Recordings; read the status “Aufnahmen (ACTi)” in the app | Input = #18"
Z2_20 = "Notification | Meldung Test-Push (ACTi) | Text: ACTi Kamera – test push: the way from the plugin into the Loxone app works (own block only for the test) | Input = #16"
Z2_21 = "AND | Person vor der Kamera (ACTi) | output Q to your own outdoor light (not part of the list); 1 as long as the notification window runs after a picture with a detected person (2 minutes by default) | I1 = #14, I2 = #12"
Z2_22 = "Status | Aufnahmen (ACTi) | rows: V6 = 1 “test push running – if no message ‘Test-Push (ACTi)’ arrives within one minute, check the notification in Loxone”; V2 = 0 “push release in the plugin off – recordings are not reported; in the plugin tab Settings switch on ‘Report Push release to Loxone’”; V5 < 0 “no picture taken yet”; V3 = 1 “person in the last picture (<v5> min ago) – <v4> objects detected”; V1 = 1 “just recorded – picture in the plugin tab Recordings”; without condition “last picture <v5> min ago; <v4> objects detected (only with object detection)”; visualisation ON | V1 = #12, V2 = #13, V3 = #14, V4 = #15, V5 = #17, V6 = #16"
