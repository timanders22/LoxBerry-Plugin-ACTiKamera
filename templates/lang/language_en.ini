A_RTSP_NEIN = "No – checked on %s: %s (address %s)."
K_RTSP = "Check RTSP path"
H_RTSP = "<b>Check RTSP path</b> runs ffmpeg once per camera against the RTSP address the live image uses as well: one second of video, at most 8 s, nothing is saved. The camera password reaches ffmpeg through a file and does not show up in the process list. The result is shown in the check line above. „Picture size 0x0“ or „unspecified size“ means: the camera delivers this stream as MJPEG above 2040 pixels – that cannot be carried over RTSP; choose stream2 (H.264) as RTSP stream. „Invalid data“ means: the camera answers, but ffmpeg cannot read its RTSP stream – check the encoding in the camera (e.g. H.264 instead of MJPEG)."
M_RTSP = "RTSP check:"
M_RTSP_JA = "%s reachable (%d ms)."
M_RTSP_NEIN = "%s not reachable – %s."
M_RTSP_NICHT = "%s cannot be checked – %s."
