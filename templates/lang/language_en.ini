H_MINDESTPAUSE = "If the camera triggers by itself it can do so every second — the ACTi configurator suggests a trigger interval of one second, which would be 3600 images per hour. The pause only applies to calls from outside; the button in the Test tab and the timelapse are not affected. Off by default so it does not swallow a doorbell recording nobody asked it to."
