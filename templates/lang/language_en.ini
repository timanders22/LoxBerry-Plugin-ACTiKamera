F_DIENSTAUSSAGE = "Does no statement of the plugin about itself go out retained?"
A_DIENSTAUSSAGE_OK = "Yes: OK, ERREICHBAR, FEHLER, ALTER, PUSHAKTIV, PTEST and the sign of life zaehler go out non-retained. Whatever 1.9.19 to 1.9.21 sent of them retained is cleared by the one-minute cycle (README, version 1.9.22)."
