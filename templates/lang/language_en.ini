A_BILD_OFFEN_OHNE_KENNWORT = "The fixed address is on and no stream password is set — every device on the home network can fetch letztesbild.jpg. That has always been the default and is defensible on a private network; for tighter control set a stream password and clear the fixed address checkbox."
