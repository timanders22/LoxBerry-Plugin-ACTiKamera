Z2_16 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_PTEST | 1 = test push running (5 minutes after the button “Test push message” in the plugin tab Test or the command acti/befehl/testpush); comes at once; never retained; version 2: tick | —"
Z2_17 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_ALTER | age of the latest picture in minutes; -1 = none yet (further instance, also on page “ACTi-Kamera”) | —"
Z2_18 = "AND | Aufnahme bei Abwesenheit (ACTi) | — (the camera took a picture while nobody is home) | I1 = #12, I2 = #3"
Z2_19 = "Notification | Meldung Aufnahme bei Abwesenheit (ACTi) | Text: ACTi Kamera – a picture was taken at the front door (doorbell, motion or the camera itself) while nobody is home. Pictures in the plugin tab Recordings; read the status “Aufnahmen (ACTi)” in the app | Input = #18"
Z2_20 = "Notification | Meldung Test-Push (ACTi) | Text: ACTi Kamera – test push: the way from the plugin into the Loxone app works (own block only for the test) | Input = #16"
Z2_21 = "AND | Person vor der Kamera (ACTi) | output Q to your own outdoor light (not part of the list); 1 as long as the notification window runs after a picture with a detected person (2 minutes by default) | I1 = #14, I2 = #12"
Z2_22 = "Status | Aufnahmen (ACTi) | rows: V6 = 1 “test push running – if the message ‘Test-Push (ACTi)’ does not arrive within a few seconds, check the notification in Loxone”; V2 = 0 “push release off in the plugin – recordings are not reported; switch on ‘Report push release to Loxone’ in the plugin tab Settings”; V5 < 0 “no picture taken yet”; V3 = 1 “person in the latest picture (<v5> min ago) – <v4> objects detected”; V1 = 1 “just recorded – picture in the plugin tab Recordings”; without condition “latest picture <v5> min ago; <v4> objects detected (only with object detection)”; visualisation ON | V1 = #12, V2 = #13, V3 = #14, V4 = #15, V5 = #17, V6 = #16"
