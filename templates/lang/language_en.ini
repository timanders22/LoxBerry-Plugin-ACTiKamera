H_RTSP_MJPEG = "<b>Note on the RTSP stream:</b> MJPEG above 2040 pixels cannot be carried over RTSP – on ACTi cameras stream1 is often MJPEG 2048×1536, and the live image then stays empty. Choose stream2 (H.264) under „Which stream“ instead, or //stream2 in an entered RTSP address, e.g. rtsp://&lt;camera&gt;:7070//stream2. „Check RTSP path“ on the Test tab detects this case. If RTSP delivers no first image within 12 s, the live image falls back to snapshots with „Automatic“ and shows an error image with „Only RTSP“; the reason is in the log."
