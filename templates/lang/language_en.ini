G_RTSP_DATEI = "the hand-over file for ffmpeg could not be written"
G_RTSP_START = "ffmpeg could not be started"
G_RTSP_FRIST = "no answer within %d s (timeout)"
G_RTSP_RC = "ffmpeg ended with return code %d and no message"
G_RTSP_KEINBILD = "ffmpeg ended without a single image"
G_RTSP_FRIST_MELDUNG = "no image within %d s (time limit reached) – last message from ffmpeg: %s"
G_RTSP_KODIERUNG = "The camera answers, but ffmpeg cannot read its RTSP stream – check the encoding in the camera (e.g. H.264 instead of MJPEG)"
G_RTSP_MJPEG2040 = "MJPEG above 2040 pixels cannot be carried over RTSP (the camera delivers this stream e.g. as MJPEG 2048×1536) – choose stream2 (H.264) as RTSP stream"
