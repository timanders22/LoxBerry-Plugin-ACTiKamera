WARUM = "<b>MQTT is the preferred path.</b> The sample project (tab Loxone integration, step 4) uses the virtual HTTP input: ready import file, with ALTER, HERZ and ZAEHLER; MQTT brings person detection and recording at once – just not both ways at the same time. The plugin pushes every change to the Miniserver by itself — a person detection is therefore available at once instead of waiting for the next poll. Only what has changed is sent; states go out retained and are therefore available again right after a broker restart. How old the latest capture is, is told by the retained topic <span class='sm-mono'>zeit</span> — a timestamp from which the Miniserver computes the age itself. <span class='sm-mono'>ALTER</span> is no longer sent over MQTT since 1.9.19: the value changed every minute and thus slipped past the send-only-on-change filter. It remains unchanged in the response line of the virtual HTTP input."
