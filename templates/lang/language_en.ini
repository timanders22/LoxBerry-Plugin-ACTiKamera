[TOKEN]
K_NEU_WARNUNG = "<b>Caution:</b> a new token immediately invalidates every address in Loxone and every trigger address in the camera (<span class='sm-mono'>e.php?t=…</span>). Afterwards both import files must be regenerated and imported again, and the addresses in the camera must be re-entered."
H = "Action token — step 2a"
TEXT = "Every call that triggers something requires this token. It is part of the addresses below and is created when this page is opened for the first time. Without a token the endpoint answers HTTP 403, and a virtual output does not evaluate the answer — the failure would stay silent."
OFFEN = "Without a token only calls that change nothing remain reachable: the status line and <span class='sm-mono'>?json=1</span>. <span class='sm-mono'>?letztes=1</span> sits behind the stream password since 1.9.19 — if you have set one, append <span class='sm-mono'>&amp;t=…</span> to that address; without a stream password it stays open as before."
PRUEFEN = "This is how to check whether an address entered in Loxone is still valid — without triggering anything:"
PRUEFEN_ANTWORT = "Answer with the correct token: <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span>. With a wrong token HTTP 403 and <span class='sm-mono'>SELFTEST;OK=0;ERR=TOKEN</span>."
K_NEU = "Create new token"

[AUSL]
H = "Triggering by the camera or another device"
TEXT = "Some cameras can call an address themselves on their own motion detection (in the ACTi web configurator under <i>Event → Event Server → HTTP Server</i>). This is the address to enter there — it takes an image, nothing else. You may append <span class='sm-mono'>&amp;a=klingel</span> for a different trigger and <span class='sm-mono'>&amp;c=1</span> for an image series."
LAENGE = "%d characters."
ANMELDUNG = "If the camera additionally demands <i>user name</i>, <i>password</i> and a <i>network port</i> — the ACTi configurator does — enter <span class='sm-mono'>80</span> as the port and something meaningless as the credentials, for example <span class='sm-mono'>kamera</span> and <span class='sm-mono'>x</span>. The plugin does not evaluate them. A real password does not belong there: the camera sends it on every trigger as HTTP Basic over the network, and that is only Base64."
ZU_LANG = "The address field of the ACTi camera only holds 64 characters — this address will be cut off and the camera will not reach the LoxBerry. A shorter host name helps."
HINWEIS = "This token may only record — it cannot clean the archive and cannot read the diagnosis. Every camera has its own; the token tells the plugin which one is meant. The button Create new token also rolls these again."

[BAUSTEIN]
TEXT = "Two pages from the LoxBerry plugins sample project, built and connected there in Loxone Config: <b>“ACTi-Kamera”</b> shows whether plugin and camera are running and reports a fault (for everybody); <b>“ACTi-Kamera Aufnahmen”</b> takes a picture on doorbell, button and motion and reports recordings while nobody is home. Since 1.9.32 the values come via the MQTT gateway (virtual inputs with the names from step 1) and the commands via the command bridge (step 2) – without a token in the project file. Per page: instructions, table (work through it from top to bottom), notes and picture; the names apply to camera 1. Loxone Config finds the blocks via the block search (<b>F5</b>)."
T_TYP = "Block (type)"
T_NAME = "Name"
T_PARAM = "Parameters"
T_VERB = "Connect inputs to"
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "In the plugin tab “%s” enter address, user and password of the camera, leave “%s” at 5, save. Tab “%s” → “%s” and “%s”: a picture must appear."
S1_SCHRITT2 = "Tab “%s”: leave “%s” switched on (on by default since 1.9.32). In the LoxBerry MQTT gateway enter nothing under version 1 (the plugin’s subscription file carries acti/#), under version 2 tick the data points from step 1, acti_OK and acti_ERREICHBAR with “Noncached”. In Loxone Config create one virtual input per value in the tree “Virtual Inputs” with exactly the name from step 1 (copy button), do not tick “Use as digital input”; the LoxBerry user needs rights on these inputs in Loxone."
S1_SCHRITT3 = "Create the page “ACTi-Kamera”, drag the virtual inputs no. 1–9 onto it, plus the constant 1 (no. 10, block search F5, value 1). Create the notification “Meldung Plugin gestört (ACTi)” (Periphery → Messages → Notification), text as in the table; it gets exactly one connection."
S1_SCHRITT4 = "Place the remaining blocks via the block search (key F5), parameters as in the table, connect from top to bottom. On the Value Validator no. 11 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0). Status “Zustand (ACTi)”: click “+” twice first (V5, V6); enter the rows in the given order, the one without condition last."
S1_SCHRITT5 = "Save and transfer to the Miniserver. Check: “Zustand (ACTi)” shows “läuft – Kamera antwortet …”, and acti_zaehler counts on by one every minute. At Miniserver start send “reconnect” to the gateway (page “LoxBerry MQTT-Gateway” in the sample project), then the retained values are available at once."
S1_H1 = "The message only comes after 10 minutes of fault; a restart of LoxBerry, Miniserver or camera reports nothing – reachability and sign of life come every minute. A camera that is deliberately switched off also reports after 10 minutes."
S1_H2 = "On no. 9 and 11: acti_zaehler is the sign of life of the minute cycle via MQTT. If the LoxBerry, the gateway or the cycle stands still, all inputs keep their last value – only the stationary sign of life reveals it. The topics online and ts no longer exist since 1.9.32; whoever uses them in their own logic takes acti_zaehler."
S1_H3 = "On no. 12: detecting “camera does not answer” needs the check in the plugin (acti_ERREICHBAR); acti_OK only means “address entered”. If you set “%s” to 0, you only see the sign of life of the LoxBerry."
S1_H4 = "Several cameras: per camera acti_OK2, acti_ERREICHBAR2 … are added (camera 1 stays as it is; names see step 1). Per camera its own NOT on its ERREICHBAR, the faults via further ORs (two inputs each) in front of no. 14 – never several sources directly on the notification. Sign of life and minute cycle exist only once."
S1_H5 = "If you built with the virtual HTTP input “ACTi Kamera” up to 1.9.31: that way remains (tab Loxone integration, “Existing installations”; after an update the read branch stays on). For new installations take the virtual inputs – not both ways at once."
S2_SCHRITT1 = "In the plugin tab “%s” set the tick “%s” and save (off by default; only works together with “Publish values via MQTT”). In the plugin tab “%s” leave “%s” switched on, “%s” at 2."
S2_SCHRITT2 = "Create the page “ACTi-Kamera Aufnahmen”. Create the four commands no. 5, 7, 9, 11 as virtual output commands on the existing output “LoxBerry MQTT-Gateway” (/dev/udp/<LoxBerry>/11884), command on ON as in the table, never “retain”; drag the virtual inputs no. 12–17 and 23–24 (names from step 1) onto it, add “Türklingel (eigene Quelle)” from the tree (in your own project your own doorbell)."
S2_SCHRITT3 = "Create the push buttons “Türtaster (eigene Quelle)” and “Bewegungsmelder (eigene Quelle)” as virtual inputs (or take your own inputs right away), plus the notifications “Meldung Aufnahme bei Abwesenheit (ACTi)” and “Meldung Test-Push (ACTi)” (Periphery → Messages → Notification), text as in the table. Presence comes from BLE-Scanner NG (switch on the house value haus/anwesenheit there)."
S2_SCHRITT4 = "Place the remaining blocks via the block search (F5) and connect from top to bottom. On the AND no. 3 negate both inputs, on the AND no. 4 input I2: click on the input point, then the input shows a small circle. On the Value Validator no. 26 remove the tick at ‘En’. Status “Aufnahmen (ACTi)”: click “+” twice first (V5, V6)."
S2_SCHRITT5 = "Save and transfer. Check: press “Türklingel (eigene Quelle)” in the app – after 3 s a picture is taken (plugin tab “%s”), “Aufnahmen (ACTi)” shows “gerade aufgenommen”. In the plugin tab “%s” → “%s”: the message “Meldung Test-Push (ACTi)” arrives within a few seconds."
S2_H1 = "If you built up to 1.9.31: replace the four commands on the output “ACTi Kamera senden” (HTTP with action token) by the commands on the output “LoxBerry MQTT-Gateway” and set the tick “Accept commands via MQTT” in the plugin; the HTTP commands keep working as long as they are in the project – not both at once, otherwise two pictures are taken."
S2_H2 = "Picture on ringing: if somebody is home, a single picture; if nobody is there, a picture series and the message “Aufnahme bei Abwesenheit” – never picture and series at once. The value behind the command (klingel, tuer, bewegung) goes as occasion into the file name, the log and the MQTT topic anlass. If the presence source is silent for more than 120 s, “somebody at home” applies."
S2_H3 = "If the camera triggers itself, set “%s” in the plugin to 20–30 – it applies to all ways (HTTP, camera, MQTT); a doorbell shortly after a motion is then rejected (the plugin logs it and says so in the acknowledgement). If the camera keeps triggering itself, acti_PUSHAKTIV stays at 1 and “Aufnahme bei Abwesenheit” reports only once."
S2_H4 = "Together with the page “Intercom”: the same doorbell delays the photo of the door station there. In your own project put both photo commands behind ONE delay; Signal message and announcement on ringing come from the pages “Intercom”, “SignalBot Befehle und Meldungen” and “Sprachsteuerung” – not again here."
S2_H5 = "The last picture in the app: enter the address from “Show the picture in the app” (…/plugins/actikamera/letztesbild.jpg) in the Door Controller or Intercom block or in a web page; the live stream comes from …/cam_stream.php. Neither depends on the HTTP read branch. A Loxone notification carries no picture."
S2_H6 = "“Person vor der Kamera” (no. 21) is the switching output for an outdoor light; it only works with “%s” switched on. A further trigger of a message comes via an OR in front of no. 18 or 19 – never several sources directly on a notification. Several cameras: per camera its own AND chain on its PUSHAKTIV, combined via an OR in front of no. 19."
Z1_01 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_OK | 1 = an address is entered for the camera in the plugin; does not say whether it answers (acti_ERREICHBAR says that); comes with every minute cycle, never retained; version 2: tick and “Noncached” | —"
Z1_02 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_ALTER | age of the latest picture in minutes; -1 = none yet; changes every minute, never retained; version 2: tick | —"
Z1_03 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_BILDER | number of pictures in the archive; comes right after every recording; retained; version 2: tick | —"
Z1_04 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_CLIPS | number of picture series in the archive; retained; version 2: tick | —"
Z1_05 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_ZEITRAFFER | number of time-lapse pictures (only with time lapse switched on in the plugin); retained; version 2: tick | —"
Z1_06 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_ERREICHBAR | 1 = the camera answered the last check (the plugin asks it every 5 minutes by default, without fetching a picture); 0 = no answer, or the last check is older than 15 minutes; -1 = never checked; comes with every minute cycle, never retained; version 2: tick and “Noncached” | —"
Z1_07 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_FEHLER | checks in a row without an answer from the camera; 0 = the last one succeeded; never retained; version 2: tick | —"
Z1_08 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_zeit_unix | time of the latest picture in Unix seconds; -1 = none yet; for your own logic (Unix Timestamp from the time functions minus this value = age in seconds; minus 1230768000 = Loxone time); retained; version 2: tick | —"
Z1_09 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_zaehler | sign of life of the minute cycle: counts on by one at every run, 0 to 999, wraps around – even when nothing else changes; never retained; version 2: tick | —"
Z1_10 = "Constant | Konstante 1 | value 1 | —"
Z1_11 = "Value Validator | Lebenszeichen fehlt (ACTi) | Tmc 300 s (five minute cycles without a new sign of life), Min 0, Max 999 – if the LoxBerry, the MQTT gateway or the minute cycle stands still, or MQTT is off in the plugin, the counter stops; remove the tick at ‘En’ in the properties window | V = #9, En = #10"
Z1_12 = "NOT | Keine frischen Daten (ACTi) | — (the camera does not answer) | I = #6"
Z1_13 = "OR | Störung (ACTi) | — (no fresh data or sign of life missing) | I1 = #12, I2 = output E of #11"
Z1_14 = "Switch-On Delay | Störung bestätigt (ACTi) | 600 s (ten minute cycles, containing at least two camera checks; reachability and sign of life come every minute, so a restart of LoxBerry, Miniserver or camera reports nothing) | Eingang = #13"
Z1_15 = "Notification | Meldung Plugin gestört (ACTi) | Text: ACTi Kamera – seit 10 Minuten gestört: die Kamera antwortet nicht (Strom, Netz) oder der LoxBerry, das MQTT-Gateway bzw. der Minutentakt des Plugins steht. Klingel-Bilder fehlen dann. In der App den Status „Zustand (ACTi)“ lesen | Eingang = #14"
Z1_16 = "Status | Zustand (ACTi) | rows: V5 = 0 “no camera entered – enter address, user and password of the camera in the plugin tab Settings, save, then tab Test ‘Check connection’”; V1 = 1 “no sign of life for 5 minutes – LoxBerry, MQTT gateway (version 1: subscription acti/#, version 2: tick on acti/zaehler) or the minute cycle of the plugin stands still; check ‘Publish values via MQTT’ in the plugin tab MQTT”; V2 < 0 “camera never checked – in the plugin tab Settings set ‘Check reachability every … minutes’ above 0 (default 5)”; V2 = 0 “camera does not answer – <v3> checks in a row without an answer; check power and network of the camera, in the plugin tab Test ‘Check connection’”; V6 < 0 “running – camera answers, no picture taken yet”; without condition “running – camera answers, last picture <v6> min ago”; visualisation ON | V1 = output E of #11, V2 = #6, V3 = #7, V5 = #1, V6 = #2"
Z1_17 = "Status | Archiv (ACTi) | rows: V4 < 0 “no picture yet – in the plugin tab Test press ‘Take a picture now’”; without condition “<v1> pictures, <v2> picture series, <v3> time-lapse pictures in the archive; last picture <v4> min ago”; visualisation ON | V1 = #3, V2 = #4, V3 = #5, V4 = #2"
Z2_01 = "Virtual input (push button) | Türklingel (eigene Quelle) | 1 = the doorbell rings (further instance, the same placeholder as on “Intercom”, “SignalBot Befehle und Meldungen” and “Dashboard Steuerung”); in your own project connect your own doorbell button or the bell output of the Door Controller block to no. 2 instead of this button | —"
Z2_02 = "Switch-On Delay | Klingel-Foto verzögern (ACTi) | 3 s (before that the visitor is not in the picture yet) | Input = #1"
Z2_03 = "AND | Niemand zu Hause (Haus, ACTi) | — (I1 and I2 negated: in Config click on the input point, a small circle appears) 1 = haus/anwesenheit/jemand reports 0 AND the source is alive; if the source is silent, “somebody at home” applies (single picture, no absence message); if you have your own presence, put its “nobody there” instead of this AND on no. 4, 6 and 18 | I1 = #23 (negated), I2 = output E of #26 (negated)"
Z2_04 = "AND | Klingeln, jemand zu Hause (ACTi) | — (I2 negated: in Config click on the input point, a small circle appears) | I1 = #2, I2 = #3 (negated)"
Z2_05 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | ACTI_Bild_Klingel | command on ON: publish acti/befehl/foto klingel (never retain); take a picture, occasion doorbell; only works with the tick “Accept commands via MQTT” (plugin tab MQTT); the answer is under acti/befehl/foto/quittung | Eingang = #4"
Z2_06 = "AND | Geklingelt, niemand zu Hause (ACTi) | — (a picture series instead of the single picture – never both at once, otherwise a configured minimum pause swallows one of them) | I1 = #2, I2 = #3"
Z2_07 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | ACTI_Bildserie_Klingel | command on ON: publish acti/befehl/clip klingel (never retain); take a picture series (default 10 seconds, 2 pictures per second), occasion doorbell – shows who was at the door while nobody was home; tick as no. 5; the answer is under acti/befehl/clip/quittung | Eingang = #6"
Z2_08 = "Virtual input (push button) | Türtaster (eigene Quelle) | 1 = the button at the front door was pressed; in the app for trying out; in your own project connect your own button to no. 9 instead of this button | —"
Z2_09 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | ACTI_Bild_Tuer | command on ON: publish acti/befehl/foto tuer (never retain); take a picture, occasion door button; tick as no. 5 | Eingang = #8"
Z2_10 = "Virtual input (push button) | Bewegungsmelder (eigene Quelle) | 1 = motion in front of the door; in the app for trying out; in your own project connect your own motion detector to no. 11 instead of this button; if the camera triggers itself (plugin tab Loxone integration, “Triggering by the camera”), leave out no. 10 and 11 | —"
Z2_11 = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT) | ACTI_Bild_Bewegung | command on ON: publish acti/befehl/foto bewegung (never retain); take a picture, occasion motion detector; tick as no. 5 | Eingang = #10"
Z2_12 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_PUSHAKTIV | 1 = a picture was just taken (doorbell, button, motion or the camera itself) – comes right after the recording and stays 1 as long as the notification window set in the plugin (default 2 minutes); always 0 if the push release is off in the plugin; never retained; version 2: tick | —"
Z2_13 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_PUSH | 1 = “Report push release to Loxone” is switched on in the plugin; retained; version 2: tick | —"
Z2_14 = "Virtual input (name as the MQTT gateway assigns it, plugin ACTi Kamera) | acti_PERSON | 1 = a person was detected in the latest picture (only with AI object detection in the plugin); comes right after the recording and stays until the next picture; retained; version 2: tick | —"
