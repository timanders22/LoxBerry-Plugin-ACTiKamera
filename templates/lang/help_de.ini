; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "ACTi Kamera"
K02 = "Holt Bilder von einer <b>ACTi-Netzwerkkamera</b> (E-Serie und alle Modelle mit der klassischen CGI-Schnittstelle) und stellt sie Loxone bereit — <b>ohne dass Benutzername und Passwort in der Loxone-Projektdatei stehen müssen</b>."
K03 = "Genau das ist der eigentliche Zweck: Bindet man eine Kamera direkt in Loxone ein, landet die Adresse samt <code>USER=…&amp;PWD=…</code> im Klartext in der Projektdatei — und damit in jedem Backup und jeder Kopie, die man weitergibt. Mit diesem Plugin ruft Loxone nur noch <code>cam.php?foto=1</code> auf; die Zugangsdaten bleiben auf dem LoxBerry."
K04 = "Kompatibel mit LoxBerry 3.x und <b>LoxBerry 4</b> (reines PHP, PHP 7.4 und 8.x)."
K05 = "Funktionen"
K06 = "<b>Schnappschuss auf Zuruf</b> — ausgelöst von Loxone: Klingel, Türtaster, Bewegungsmelder; der Anlass wird mitgespeichert"
K07 = "<b>Bildserie</b> („Clip“) über mehrere Sekunden, ohne ffmpeg oder Zusatzpakete"
K08 = "<b>Letztes Bild unter fester Adresse</b> (<code>letztesbild.jpg</code>) für Kamera-Kachel, Webseiten-Baustein oder Push-Anhang — ohne Zugangsdaten in der URL"
K09 = "<b>Push-Auslöser für Loxone</b>: <code>PUSHAKTIV=1</code> für ein einstellbares Zeitfenster nach jeder Aufnahme"
K10 = "<b>Zeitraffer</b>: täglich zur eingestellten Uhrzeit ein Bild in den Unterordner <code>timelapse</code> (Dateiname = Datum); ist <code>ffmpeg</code> vorhanden, wird daraus <code>zeitraffer.mp4</code> neu erzeugt"
K11 = "<b>Archiv-Bereinigung</b> täglich um 03:35 Uhr, nach <b>Alter und Anzahl</b> (jeweils 0 = unbegrenzt) über Bilder, Bildserien und Zeitraffer — die neuesten Dateien bleiben erhalten"
K12 = "<b>KI-Objekterkennung</b> (optional) über CodeProject.AI oder DeepStack: erkannte Objekte erscheinen im JSON, in den Webhooks, per MQTT und als <code>ERKANNT=</code> in der Loxone-Ausgabe; <code>PERSON=1</code> ist der fertige Schalter"
K13 = "<b>Webhooks</b>: Webhook 1 als POST mit JSON, Webhook 2 als GET mit Parametern"
K14 = "<b>MQTT</b> über das LoxBerry MQTT Gateway, <b>JSON</b> für Drittsoftware"
K15 = "Reiter: Einstellungen, Einbindung in Loxone (Schritt-für-Schritt inkl. kompletter Baustein-Liste), Aufnahmen, Test, Protokoll"
K16 = "Endpunkte"
K17 = "Sicherheit und Datenschutz"
K18 = "Zugangsdaten stehen ausschließlich in <code>config/plugins/actikamera/cam.json</code>; die Datei wird auf <code>chmod 600</code> gesetzt (nur für den Besitzer lesbar)"
K19 = "Das Passwort wird in der Oberfläche nie angezeigt und im Protokoll maskiert"
K20 = "Im Plugin sind <b>keine persönlichen Daten</b> enthalten"
K21 = "Aufnahmen liegen lokal auf dem LoxBerry und werden nach der eingestellten Aufbewahrungszeit gelöscht"
K22 = "Fehlerbehebung: „ERROR: not authorized“"
K23 = "Die ACTi-CGI <b>dekodiert ihre Parameter nicht prozentweise</b>. Ein vollständiges <code>rawurlencode()</code> des Passworts macht daraus einen anderen String, und die Kamera lehnt ab — auch wenn dieselben Zugangsdaten im Browser funktionieren. Seit v1.1.0 werden nur noch die Zeichen ersetzt, die die Abfragezeichenkette zerreißen würden (<code>% &amp; = # +</code> und Leerzeichen)."
K24 = "Zweite häufige Ursache: Manche Modelle verlangen HTTP-Basic oder Digest und lehnen ab, wenn zusätzlich <code>USER</code>/<code>PWD</code> in der URL stehen. Deshalb gibt es in den Einstellungen das <b>Anmeldeverfahren</b>; auf „Automatisch“ probiert das Plugin der Reihe nach URL-Parameter, Basic und Digest durch und merkt sich den Weg, der funktioniert hat."
K25 = "Aufruf"
K26 = "Zweck"
K27 = "<code>/plugins/actikamera/cam.php</code>"
K28 = "Loxone-Zeile <code>ACTI;OK=..;ALTER=..;PUSHAKTIV=..;…</code>"
K29 = "<code>/plugins/actikamera/cam.php?foto=1&amp;anlass=klingel</code>"
K30 = "Bild aufnehmen"
K31 = "<code>/plugins/actikamera/cam.php?clip=1&amp;anlass=klingel</code>"
K32 = "Bildserie aufnehmen"
K33 = "<code>/plugins/actikamera/cam.php?letztes=1</code>"
K34 = "letztes Bild als JPEG"
K35 = "<code>/plugins/actikamera/cam.php?json=1</code>"
K36 = "Zustand als JSON"
K37 = "<code>/plugins/actikamera/cam.php?test=1</code>"
K38 = "Verbindungstest im Klartext"
K39 = "<code>/plugins/actikamera/cam.php?timelapse=1</code>"
K40 = "Zeitrafferbild jetzt aufnehmen"
K41 = "<code>/plugins/actikamera/cam.php?cleanup=1</code>"
K42 = "Archiv jetzt aufräumen"
K43 = "<code>/plugins/actikamera/cam.php?ptest=1</code>"
K44 = "Test-Pushnachricht auslösen"
