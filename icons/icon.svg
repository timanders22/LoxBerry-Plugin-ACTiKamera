<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="schale" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0"    stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f2f1e7"/>
      <stop offset="1"    stop-color="#d5d4c7"/>
    </linearGradient>
    <linearGradient id="rand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e8dd"/><stop offset="1" stop-color="#c3c2b5"/>
    </linearGradient>
    <radialGradient id="innen" cx="0.4" cy="0.25" r="0.95">
      <stop offset="0"   stop-color="#3a4249"/>
      <stop offset="0.6" stop-color="#1b2126"/>
      <stop offset="1"   stop-color="#080b0d"/>
    </radialGradient>
    <radialGradient id="glas" cx="0.36" cy="0.3" r="0.85">
      <stop offset="0"    stop-color="#5b7488"/>
      <stop offset="0.45" stop-color="#243543"/>
      <stop offset="1"    stop-color="#05080a"/>
    </radialGradient>
  </defs>

  <circle cx="256" cy="256" r="248" fill="#6dac20"/>
  <circle cx="256" cy="256" r="248" fill="none" stroke="#5c9219" stroke-width="10"/>

  <!-- Aussenschale: flache Kuppel, an der Decke sitzend -->
  <path d="M92 296 A164 164 0 0 1 420 296 Z" fill="url(#schale)"/>
  <ellipse cx="256" cy="296" rx="164" ry="30" fill="url(#rand)"/>
  <path d="M92 296 A164 164 0 0 1 420 296" fill="none" stroke="#b9b8aa" stroke-width="4"/>

  <!-- Ringnaht zwischen Ober- und Unterteil -->
  <path d="M104 258 A160 160 0 0 0 408 258" fill="none" stroke="#c0bfb1" stroke-width="6"/>

  <!-- Schwarze Innenkuppel, nach unten gewoelbt -->
  <path d="M148 292 A108 108 0 0 0 364 292 Z" fill="url(#innen)"/>
  <ellipse cx="256" cy="292" rx="108" ry="20" fill="#11161a"/>

  <!-- Objektiv mit Fassung -->
  <circle cx="256" cy="332" r="58" fill="#151b20"/>
  <circle cx="256" cy="332" r="47" fill="url(#glas)"/>
  <circle cx="256" cy="332" r="47" fill="none" stroke="#000000" stroke-width="4" opacity="0.7"/>
  <circle cx="256" cy="332" r="20" fill="#0b1116"/>
  <ellipse cx="238" cy="314" rx="15" ry="11" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="276" cy="350" rx="8"  ry="6"  fill="#8fd0ff" opacity="0.25"/>

  <!-- Infrarot-Kranz um das Objektiv -->
  <g fill="#aab4bb">
    <circle cx="256" cy="256" r="0"/>
    <circle cx="176" cy="318" r="11"/><circle cx="182" cy="356" r="11"/>
    <circle cx="200" cy="386" r="11"/><circle cx="336" cy="318" r="11"/>
    <circle cx="330" cy="356" r="11"/><circle cx="312" cy="386" r="11"/>
    <circle cx="214" cy="290" r="10"/><circle cx="298" cy="290" r="10"/>
  </g>

  <!-- Glanz auf der Schale -->
  <path d="M140 268 A140 140 0 0 1 214 162" fill="none" stroke="#ffffff" stroke-width="12"
        stroke-linecap="round" opacity="0.55"/>
</svg>
