<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#7dc424" />
      <stop offset="65%" stop-color="#6dac20" />
      <stop offset="100%" stop-color="#568819" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Outer Badge Ring -->
  <circle cx="256" cy="256" r="246" fill="url(#bg-grad)" />
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3" />

  <g filter="url(#shadow)" fill="#ffffff">
    <!-- Dome Camera Mount -->
    <rect x="181" y="125" width="150" height="18" rx="6" fill="#ffffff" />
    <rect x="191" y="143" width="130" height="16" rx="4" fill="#ffffff" />
    
    <!-- Outer Glass Dome -->
    <path d="M 198 159 C 198 159, 198 260, 256 260 C 314 260, 314 159, 314 159 Z" fill="#ffffff" />
    
    <!-- Inner Dark Lens Housing -->
    <path d="M 208 159 C 208 159, 208 245, 256 245 C 304 245, 304 159, 304 159 Z" fill="#6dac20" />
    
    <!-- Camera Lens -->
    <circle cx="256" cy="195" r="22" fill="#ffffff" />
    <circle cx="256" cy="195" r="13" fill="#6dac20" />
    <circle cx="262" cy="189" r="3" fill="#ffffff" />
    
    <!-- IR LEDs around Lens -->
    <circle cx="280" cy="171" r="3" fill="#ffffff" />
    <circle cx="232" cy="171" r="3" fill="#ffffff" />
    <circle cx="280" cy="219" r="3" fill="#ffffff" />
    <circle cx="232" cy="219" r="3" fill="#ffffff" />

    <!-- Vision / Field of View Arcs -->
    <path d="M 221 250 A 35 15 0 0 0 291 250" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" />
    <path d="M 198 268 A 58 22 0 0 0 314 268" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8" />
    <path d="M 176 286 A 80 28 0 0 0 336 286" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.5" />

    <!-- Dashed Line -->
    <path d="M 150 345 L 362 345" stroke="#ffffff" stroke-width="4" stroke-dasharray="6 8" opacity="0.8" />
  </g>

  <!-- Typography
       ZUR SCHRIFTGROESSE: 29 px fuer den Plugin-Namen, 20 px fuer LOXBERRY -
       einheitlich ueber alle Plugins. Massgeblich fuer den Rand ist die
       UNTERSTE Bildzeile der Schrift, dort ist der Kreis am schmalsten. -->
  <text x="256" y="388" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="900" font-size="29" letter-spacing="1">ACTi KAMERA</text>
  <text x="256" y="424" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-weight="bold" font-size="20" letter-spacing="3">LOXBERRY</text>
</svg>
