[AUTHOR]
# NEVER CHANGE this information in future updates! It is used to identify
# the plugin and handle updates.
NAME=ACTi Kamera Plugin Authors
EMAIL=actikamera@users.noreply.github.com

[PLUGIN]
# V1.0.0 Erste Fassung: ACTi-Netzwerkkameras (E-Serie, CGI-API) an Loxone.
#        Schnappschuss, Videoclip, Klingel-Ausloeser, Push, MQTT, JSON.
# V1.1.0 Anmeldung repariert (ACTi dekodiert Parameter nicht - kein rawurlencode
#        mehr; Basic/Digest waehlbar). Neu: Zeitraffer, Archiv-Bereinigung nach
#        Alter UND Anzahl, KI-Objekterkennung, Webhooks.
# V1.2.0 Schnappschuss-Befehl frei konfigurierbar (Vorgabe mit Bildqualitaet und
#        DUMMY=n wie in real funktionierenden ACTi-Konfigurationen) und Diagnose,
#        die alle Befehls- und Anmeldevarianten durchprobiert.
VERSION=1.9.7
NAME=actikamera
FOLDER=actikamera

TITLE=ACTi Kamera

[AUTOUPDATE]
# Automatische Updates ueber GitHub (release.cfg im Repository).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-ACTiKamera/main/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-ACTiKamera/main/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
